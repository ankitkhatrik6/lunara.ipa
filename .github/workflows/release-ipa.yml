name: Build and Release Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version, for example 0.5.0
        required: true
        default: 0.5.0
      build:
        description: App build number
        required: true
        default: "5"

permissions:
  contents: write

env:
  SCHEME: LunaraPlayer
  PROJECT: LunaraPlayer.xcodeproj
  APP_BUNDLE_ID: com.lunara.player
  WIDGET_BUNDLE_ID: com.lunara.player.widget

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LunaraPlayer.xcarchive" \
            MARKETING_VERSION='${{ inputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ inputs.build }}' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/LunaraPlayer.xcarchive/Products/Applications/LunaraPlayer.app" \
            "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/LunaraPlayer-unsigned.ipa"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-${{ inputs.build }}
          name: Lunara ${{ inputs.version }} (${{ inputs.build }}) - Unsigned
          generate_release_notes: true
          body: |
            This IPA is unsigned. It is intended for personal sideloading with an Apple ID.
            It is not installable directly until signed by a sideloading tool.
          files: ${{ runner.temp }}/LunaraPlayer-unsigned.ipa