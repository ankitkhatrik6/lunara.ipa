name: Build and Release IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version, for example 0.5.0
        required: true
        default: 0.5.0
      build:
        description: App build number
        required: true
        default: "5"

permissions:
  contents: write

env:
  SCHEME: LunaraPlayer
  PROJECT: LunaraPlayer.xcodeproj
  APP_BUNDLE_ID: com.lunara.player
  WIDGET_BUNDLE_ID: com.lunara.player.widget

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APP_PROFILE_BASE64" | base64 --decode > \
            "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > \
            "$RUNNER_TEMP/widget.mobileprovision"

          for profile in "$RUNNER_TEMP"/*.mobileprovision; do
            UUID=$(/usr/bin/security cms -D -i "$profile" | \
              /usr/libexec/PlistBuddy -c 'Print:UUID' /dev/stdin)
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          done

      - name: Resolve signing identities and profiles
        id: signing
        run: |
          set -euo pipefail
          APP_PROFILE="$RUNNER_TEMP/app.mobileprovision"
          WIDGET_PROFILE="$RUNNER_TEMP/widget.mobileprovision"

          APP_PROFILE_NAME=$(/usr/bin/security cms -D -i "$APP_PROFILE" | \
            /usr/libexec/PlistBuddy -c 'Print:Name' /dev/stdin)
          WIDGET_PROFILE_NAME=$(/usr/bin/security cms -D -i "$WIDGET_PROFILE" | \
            /usr/libexec/PlistBuddy -c 'Print:Name' /dev/stdin)
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" | \
            awk -F '"' '/Apple Distribution/ { print $2; exit }')

          test -n "$IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "app_profile=$APP_PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "widget_profile=$WIDGET_PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LunaraPlayer.xcarchive" \
            MARKETING_VERSION='${{ inputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ inputs.build }}' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export App Store IPA
        env:
          CODE_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          APP_PROFILE: ${{ steps.signing.outputs.app_profile }}
          WIDGET_PROFILE: ${{ steps.signing.outputs.widget_profile }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingCertificate</key><string>$CODE_SIGN_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key><string>$APP_PROFILE</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$WIDGET_PROFILE</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LunaraPlayer.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/export"/*.ipa "$RUNNER_TEMP/LunaraPlayer.ipa"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-${{ inputs.build }}
          name: Lunara ${{ inputs.version }} (${{ inputs.build }})
          generate_release_notes: true
          files: ${{ runner.temp }}/LunaraPlayer.ipa