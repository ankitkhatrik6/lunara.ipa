workflows:
  ios-release:
    name: Lunara iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - app_store_credentials
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lunara.player
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate the Xcode project
        script: xcodegen generate

      - name: Fetch App Store signing profiles
        script: xcode-project use-profiles

      - name: Build signed App Store IPA
        script: xcode-project build-ipa --project LunaraPlayer.xcodeproj --scheme LunaraPlayer
    artifacts:
      - build/ios/ipa/*.ipa
